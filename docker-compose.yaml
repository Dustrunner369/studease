services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development      
      - ConnectionStrings__DefaultConnection=${DATABASE_URL}
      - ConnectionStrings__Migrations=${DATABASE_URL_UNPOOLED}
      - Places__ApiKey=${PLACES_API_KEY}